services:
  app:
    build:
      context: .
      dockerfile: docker/dev.docker
    environment:
      - GUNICORN_CMD_ARGS=--workers=2 --threads=2
      - CLAMD_ENABLED=no
    mem_limit: 0
    depends_on: !override
      - postgres

  nextjs:
    build:
      context: .
      dockerfile: docker/nextjs.docker

  nginx:
    profiles:
      - disabled

  clamav:
    profiles:
      - disabled

  celery:
    profiles:
      - donotstart
    mem_limit: 0
