name: Create and publish Docker Images

on:
  workflow_call:
    inputs:
      SENTRY_DSN:
        required: false
        type: string
        default: ""
      SENTRY_ENVIRONMENT:
        required: false
        type: string
        default: "production"
    secrets:
      VITE_FRONTEND_CLIENT_ID:
        required: false
      VITE_TENANT_ID:
        required: false
      VITE_APPLICATION_ID_URI:
        required: false
    outputs:
      images_changed:
        value: ${{ jobs.changes.outputs.any }}


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: ./docker/app.docker
      image: ghcr.io/multilateralfund/multilateralfund-app
      SENTRY_DSN: ${{ inputs.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ inputs.SENTRY_ENVIRONMENT }}
    secrets:
      VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
      VITE_FRONTEND_CLIENT_ID: ${{ secrets.VITE_FRONTEND_CLIENT_ID }}
      VITE_APPLICATION_ID_URI: ${{ secrets.VITE_APPLICATION_ID_URI }}

  build-nextjs:
    needs: changes
    if: needs.changes.outputs.nextjs == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: ./docker/nextjs.docker
      image: ghcr.io/multilateralfund/multilateralfund-nextjs
      SENTRY_DSN: ${{ inputs.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ inputs.SENTRY_ENVIRONMENT }}
    secrets:
      VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
      VITE_FRONTEND_CLIENT_ID: ${{ secrets.VITE_FRONTEND_CLIENT_ID }}
      VITE_APPLICATION_ID_URI: ${{ secrets.VITE_APPLICATION_ID_URI }}

  build-nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: ./docker/nginx.docker
      image: ghcr.io/multilateralfund/multilateralfund-nginx

  build-celery:
    needs: changes
    if: needs.changes.outputs.celery == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: ./docker/celery.docker
      image: ghcr.io/multilateralfund/multilateralfund-celery

