name: Create and publish Docker Images

on:
  workflow_call:
    inputs:
      SENTRY_DSN:
        required: false
        type: string
        default: ""
      SENTRY_ENVIRONMENT:
        required: false
        type: string
        default: "production"
    secrets:
      VITE_FRONTEND_CLIENT_ID:
        required: false
      VITE_TENANT_ID:
        required: false
      VITE_APPLICATION_ID_URI:
        required: false
    outputs:
      images_changed:
        value: ${{ jobs.changes.outputs.any }}

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: 1.0.${{ github.run_number }}


jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  build-and-push-images:
    needs: changes

    # runs-on: ubuntu-latest
    runs-on: docker-ors # see https://helpdesk.eaudeweb.ro/issues/38046

    strategy:
      max-parallel: 1
      matrix:
        include:
          - dockerfile: ./docker/app.docker
            image: ghcr.io/multilateralfund/multilateralfund-app
            changed: ${{ needs.changes.outputs.app }}
          - dockerfile: ./docker/nextjs.docker
            image: ghcr.io/multilateralfund/multilateralfund-nextjs
            changed: ${{ needs.changes.outputs.nextjs }}
          - dockerfile: ./docker/nginx.docker
            image: ghcr.io/multilateralfund/multilateralfund-nginx
            changed: ${{ needs.changes.outputs.nginx }}
          - dockerfile: ./docker/celery.docker
            image: ghcr.io/multilateralfund/multilateralfund-celery
            changed: ${{ needs.changes.outputs.celery }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        if: matrix.changed == 'true'

      - name: Remove stale buildx builders from an interrupted run
        run: docker buildx rm --all-inactive --force || true
        if: matrix.changed == 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        if: matrix.changed == 'true'

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        if: matrix.changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        if: matrix.changed == 'true'
        with:
          images: ${{ matrix.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        if: matrix.changed == 'true'
        with:
          context: .
          push: true
          pull: false
          no-cache: false
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PUBLIC_SENTRY_DSN=${{ inputs.SENTRY_DSN }}
            VITE_PUBLIC_SENTRY_ENVIRONMENT=${{ inputs.SENTRY_ENVIRONMENT }}
            VITE_TENANT_ID=${{ secrets.VITE_TENANT_ID || '' }}
            VITE_FRONTEND_CLIENT_ID=${{ secrets.VITE_FRONTEND_CLIENT_ID || '' }}
            VITE_APPLICATION_ID_URI=${{ secrets.VITE_APPLICATION_ID_URI || '' }}
