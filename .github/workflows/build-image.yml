name: Build Docker image

concurrency:
  group: build_image-${{ github.ref }}
  cancel-in-progress: false
  queue: max

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

      dockerfile:
        required: true
        type: string

      image:
        required: true
        type: string

      SENTRY_DSN:
        required: false
        type: string
        default: ""

      SENTRY_ENVIRONMENT:
        required: false
        type: string
        default: "production"

    secrets:
      VITE_FRONTEND_CLIENT_ID:
        required: false
      VITE_TENANT_ID:
        required: false
      VITE_APPLICATION_ID_URI:
        required: false

    outputs:
      built:
        value: ${{ jobs.build.outputs.built }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: docker-ors

    name: Build ${{ inputs.name }}

    outputs:
      built: ${{ steps.result.outputs.built }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove stale buildx builders from an interrupted run
        run: docker buildx rm --all-inactive --force || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: false
          no-cache: false
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.image }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PUBLIC_SENTRY_DSN=${{ inputs.SENTRY_DSN }}
            VITE_PUBLIC_SENTRY_ENVIRONMENT=${{ inputs.SENTRY_ENVIRONMENT }}
            VITE_TENANT_ID=${{ secrets.VITE_TENANT_ID || '' }}
            VITE_FRONTEND_CLIENT_ID=${{ secrets.VITE_FRONTEND_CLIENT_ID || '' }}
            VITE_APPLICATION_ID_URI=${{ secrets.VITE_APPLICATION_ID_URI || '' }}

      - name: Mark image as built
        id: result
        run: echo "built=true" >> "$GITHUB_OUTPUT"
